[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-gym-tracker"
version = "1.0.0"
description = "MediaPipe and BiLSTM workout telemetry with a Streamlit demo"
authors = [{name = "P SAIDEEP REDDY"}]
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["gym_tracker*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the bundled TensorFlow and MediaPipe runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
